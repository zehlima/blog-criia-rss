name: Verificar alternativas oficiais RSS
on:
  push:
    branches: [main]
    paths: ['research/rss-review-2026-09-14/official-alternatives.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collector.revalidate import check
          rows=json.loads(Path('research/rss-review-2026-09-14/official-alternatives.json').read_text())
          for row in rows:
              row.update(check(row['url']))
              print(json.dumps(row,ensure_ascii=False),flush=True)
          Path('reports').mkdir(exist_ok=True)
          Path('reports/official-alternatives.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-rss-alternatives
          path: reports/official-alternatives.json
