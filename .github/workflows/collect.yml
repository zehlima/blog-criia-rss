name: Coleta global RSS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boris-global-collector
  # Explicit repair pushes replace the outdated worker; scheduled runs keep checkpoints.
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  BORIS_DYNAMIC_INVENTORY: ${{ vars.BORIS_DYNAMIC_INVENTORY }}
jobs:
  collect:
    # Farza ON HOLD: all automatic and manual jobs are suspended.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Executar
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: aws-0-sa-east-1.pooler.supabase.com
          DATABASE_USER: postgres.ikoqkeqxqfqkfjmcwwdq
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MAX_RUN_SECONDS: '3000'
          ARTICLE_WORKERS: '16'
          PYTHONFAULTHANDLER: '1'
          MODE: ${{ inputs.mode || 'run' }}
        run: python -m collector.main "$MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
