name: Coleta global RSS
on:
  schedule:
    # Brasília (UTC-3): 00h,06h,12h,18h. UTC: 03h,09h,15h,21h.
    - cron: '0 3,9,15,21 * * *'
    # Recuperação uma hora depois: retoma pendências da mesma janela.
    - cron: '0 4,10,16,22 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/collect.trigger']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, setup, run]
        default: preflight
        description: 'setup cria banco; preflight testa acessos; run coleta'
permissions:
  contents: read
concurrency:
  group: boris-global-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'schedule' || vars.ENABLE_COLLECTION != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Executar
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: aws-0-sa-east-1.pooler.supabase.com
          DATABASE_USER: postgres.ikoqkeqxqfqkfjmcwwdq
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MAX_RUN_SECONDS: '1800'
          MODE: ${{ inputs.mode || 'run' }}
        run: python -m collector.main "$MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
