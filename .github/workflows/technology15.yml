name: Validar 15 fontes globais de tecnologia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/technology15.json', 'collector/technology15.py', 'collector/publisher_listing.py', '.github/workflows/technology15.yml']
permissions:
  contents: read
concurrency:
  group: boris-technology15-audit
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Integrar fontes no coletor existente
        if: always()
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: aws-0-sa-east-1.pooler.supabase.com
          DATABASE_USER: postgres.ikoqkeqxqfqkfjmcwwdq
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m collector.technology15_ingest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technology15-validation-${{ github.run_id }}
          path: reports/technology15/
          retention-days: 90
