name: Validar conexao e primeira coleta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boris-global-collector
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MAX_RUN_SECONDS: '1800'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Diagnostico seguro do banco
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg.conninfo import conninfo_to_dict
          try:
              config = conninfo_to_dict(os.environ["DATABASE_URL"])
          except Exception:
              print("DIAGNOSTICO: formato DATABASE_URL invalido")
              raise SystemExit(1)
          expected = {"host":"aws-0-sa-east-1.pooler.supabase.com", "port":"5432", "user":"postgres.ikoqkeqxqfqkfjmcwwdq", "dbname":"postgres"}
          for key, value in expected.items():
              print("CAMPO", key, "OK" if config.get(key) == value else "DIVERGENTE")
          try:
              with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=15, sslmode="require") as db:
                  db.execute("SELECT 1")
              print("DIAGNOSTICO: banco conectado")
          except Exception as exc:
              msg = str(exc).lower()
              reason = "erro de conexao nao classificado"
              for needle, label in [("password authentication failed","senha rejeitada"),("tenant or user not found","usuario ou host incorreto"),("translate host name","DNS"),("timeout","timeout"),("ssl","TLS"),("no password supplied","senha ausente")]:
                  if needle in msg:
                      reason = label
                      break
              print("DIAGNOSTICO:", reason)
              raise SystemExit(1)
          PY
      - name: Testar banco e R2
        run: python -m collector.main preflight
      - name: Primeira coleta
        run: python -m collector.main run
