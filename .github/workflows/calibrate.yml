name: Calibrar coerencia dos temas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/calibrate.trigger']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trends/requirements.txt
      - run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r trends/requirements.txt
      - run: python -m trends.calibrate
      - uses: actions/upload-artifact@v4
        with:
          name: headline-calibration
          path: reports/headline-calibration.json
