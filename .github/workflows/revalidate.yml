name: Revalidar correcoes RSS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/revalidate.trigger']
permissions:
  contents: read
concurrency:
  group: boris-rss-revalidation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m collector.validate_inventory
      - run: python -m collector.discover_feeds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-revalidation-${{ github.run_id }}
          path: |
            reports/active-feed-validation.json
            reports/feed-discovery.json
          retention-days: 30
