name: Painel Tabler
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**', 'dashboard/**', '.github/workflows/dashboard.yml']
  workflow_run:
    workflows: ['Coleta global RSS', 'Tendencias pais continente globo', 'Fechamento diario semantico', 'Confronto 15 referencias']
    types: [completed]
  schedule:
    - cron: '35 * * * *'
permissions:
  contents: read
concurrency:
  group: dashboard-publish
  cancel-in-progress: false
env:
  BORIS_DYNAMIC_INVENTORY: ${{ vars.BORIS_DYNAMIC_INVENTORY }}
  BORIS_DISCOVERY_ENABLED: ${{ vars.BORIS_DISCOVERY_ENABLED }}
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: node --test tests/test_dashboard.mjs
      - run: python -m pytest -q tests/test_full_export.py tests/test_dashboard_export.py
      - uses: actions/cache@v4
        with:
          path: .dashboard-cache
          key: dashboard-texts-${{ github.run_id }}
          restore-keys: dashboard-texts-
      - name: Atualizar dados reais
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_HOST: aws-0-sa-east-1.pooler.supabase.com
          DATABASE_USER: postgres.ikoqkeqxqfqkfjmcwwdq
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m dashboard.export
          python -m dashboard.full_export
      - uses: actions/upload-artifact@v4
        with:
          name: painel-tabler
          path: frontend/
          retention-days: 7
  publish:
    needs: build
    if: vars.CLOUDFLARE_PUBLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: painel-tabler
          path: frontend/
      - name: Conferir acesso Cloudflare
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Falta CLOUDFLARE_API_TOKEN com Cloudflare Pages Edit'; exit 1; }
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not account:
              host = urlparse(os.environ.get("R2_ENDPOINT_URL", "")).hostname or ""
              match = re.fullmatch(r"([a-f0-9]{32})(?:\.(?:eu|fedramp))?\.r2\.cloudflarestorage\.com", host)
              if match:
                  account = match.group(1)
          if not re.fullmatch(r"[a-f0-9]{32}", account):
              raise SystemExit("::error::Falta CLOUDFLARE_ACCOUNT_ID valido ou endpoint R2 reconhecido")
          print("::add-mask::" + account)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("account_id=" + account + "\n")
          PY
      - name: Garantir projeto Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/pages/projects"
          headers = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"}
          req = urllib.request.Request(base + "/blog-criia-painel", headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              if not result.get("success"):
                  raise SystemExit("::error::Falha ao verificar projeto Pages")
              print("Projeto Pages existente")
          except urllib.error.HTTPError as error:
              result = json.load(error)
              if not any(item.get("code") == 8000007 for item in result.get("errors", [])):
                  raise SystemExit("::error::Cloudflare recusou verificacao do projeto: HTTP " + str(error.code))
              data = json.dumps({"name": "blog-criia-painel", "production_branch": "main"}).encode()
              with urllib.request.urlopen(urllib.request.Request(base, data=data, headers=headers, method="POST"), timeout=30) as response:
                  result = json.load(response)
              if not result.get("success"):
                  raise SystemExit("::error::Falha ao criar projeto Pages")
              print("Projeto Pages criado")
          PY
      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          command: pages deploy frontend --project-name=blog-criia-painel --branch=main
